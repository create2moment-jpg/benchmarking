name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system tools used by C++/CMake tasks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ cmake
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Tests (optional torch/spark tasks are reported as skipped)
        run: pytest -q -rs
      - name: Smoke benchmark against the mock adapter
        run: |
          bench validate-config
          bench doctor --no-check-endpoints
          bench run --model fake-reference --profile smoke
          bench run --model fake-noop --profile smoke
          bench report --format html --out reports/report.html
          bench report --format json --out reports/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
