[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engineering-llm-bench"
version = "0.1.0"
description = "Reproducible, scored engineering-task benchmark for comparing local and paid LLMs and agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "engineering-llm-bench contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
# Runtimes used by optional task domains. Missing runtimes => tasks are reported "skipped", never "passed".
tasks = ["numpy>=1.26", "duckdb>=1.0"]
torch = ["torch>=2.2"]
anthropic = ["anthropic>=1.0"]
spark = ["pyspark>=3.5"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "numpy>=1.26",
    "duckdb>=1.0",
]

[project.scripts]
bench = "engineering_llm_bench.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_llm_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Task fixtures contain intentionally buggy/incomplete code; they are validated by `bench task validate`.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913", # explicit dependency injection makes some constructors wide
    "PLR2004", # magic numbers are fine in small numeric helpers
    "PLR0917", # keyword-heavy internal helpers; call sites use keywords where it matters
    "PLR0911", # evaluator checks return early per outcome by design
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR2004", "S108"]
# Subprocess use is the purpose of the sandboxed runner; arguments are structured argv lists (no shell).
"src/engineering_llm_bench/tools/runner.py" = ["S603"]
"src/engineering_llm_bench/environment.py" = ["S603"]
"src/engineering_llm_bench/harnesses/cli_harness.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["engineering_llm_bench"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests that run real evaluators (python/g++) on starter tasks",
]
