# Model aliases. The alias is the stable label stored in history; model_id is the provider's ID.
# Credentials: only the NAME of an environment variable is stored (api_key_env); never the key.
schema_version: 1
models:
  # --- Clearly labelled MOCK adapters (no model is called). For tests and pipeline smoke runs.
  - alias: fake-reference
    provider: fake
    model_id: fake-reference-v1
    endpoint_type: fake
    fake: {behavior: reference}
    notes: "MOCK: replays reference solutions. Scores validate the pipeline, not a model."
  - alias: fake-noop
    provider: fake
    model_id: fake-noop-v1
    endpoint_type: fake
    fake: {behavior: noop}
    notes: "MOCK: makes no changes (expected to fail executable tasks)."
  - alias: fake-broken
    provider: fake
    model_id: fake-broken-v1
    endpoint_type: fake
    fake: {behavior: broken}
    notes: "MOCK: applies deliberately broken patches where tasks provide them."

  # --- Local models (OpenAI-compatible). Data stays on this machine.
  - alias: local-qwen
    provider: openai_compatible
    endpoint_type: ollama
    base_url: http://localhost:11434/v1
    model_id: qwen2.5-coder:14b
    serving_runtime: ollama
    quantization: Q4_K_M
    context_limit: 32768
    sampling: {temperature: 0.2, top_p: 0.95, seed: 7, max_tokens: 4096}
    timeout_s: 300
    max_concurrency: 1
  - alias: local-vllm
    provider: openai_compatible
    endpoint_type: vllm
    base_url: http://127.0.0.1:8000/v1
    model_id: Qwen/Qwen2.5-Coder-32B-Instruct
    api_key_env: VLLM_API_KEY          # only if vLLM was started with --api-key
    serving_runtime: vllm
    quantization: bf16
    context_limit: 32768
    sampling: {temperature: 0.0, seed: 7, max_tokens: 4096}
    timeout_s: 300
    max_concurrency: 2

  # --- Paid / remote models. Require --allow-remote: prompts and source code are sent.
  - alias: openai-paid
    provider: openai_compatible
    endpoint_type: openai
    base_url: https://api.openai.com/v1
    model_id: your-model-id-here
    api_key_env: OPENAI_API_KEY
    remote: true
    sampling: {temperature: 0.0, max_tokens: 8192}
    timeout_s: 300
    requests_per_minute: 30
    # pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0, source: "fill in from provider price list"}
  - alias: claude-opus
    provider: anthropic                 # needs: pip install 'engineering-llm-bench[anthropic]'
    endpoint_type: anthropic
    model_id: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    remote: true
    sampling: {max_tokens: 16000}       # temperature/top_p are not sent to current Claude models
    extra_body:
      output_config: {effort: high}
    timeout_s: 600
    requests_per_minute: 50
    pricing: {input_per_mtok: 4.0, output_per_mtok: 20.0, source: "Anthropic list price 2026-10"}

# Optional external agent-CLI harnesses (need --allow-external-harness). They manage their own
# tools, so only timeout / env scrubbing / workspace isolation apply. Example (adapt to your CLI):
harnesses:
  - name: claude-code-cli
    kind: cli
    version: "external"
    description: Claude Code in non-interactive print mode (remote).
    argv: ["claude", "-p", "--permission-mode", "acceptEdits"]
    prompt_via: stdin
    env_passthrough: [ANTHROPIC_API_KEY]
    remote: true
